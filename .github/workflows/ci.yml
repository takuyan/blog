name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Audit dependencies
        run: bundle exec bundler-audit check --update

      - name: Build site
        env:
          MIDDLEMAN_DISABLE_LIVERELOAD: "1"
        run: bundle exec middleman build --bail

      - name: Verify public artifacts
        id: public-artifacts
        run: bundle exec ruby script/verify-build

      - name: Setup Node for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify desktop and mobile behavior
        run: node script/verify-browser.mjs

      # Only screenshots of validated public pages; never upload build/ or sources.
      - name: Preserve browser verification screenshots
        if: ${{ !cancelled() && steps.public-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-page-screenshots
          path: output/playwright/*.png
          if-no-files-found: error
          retention-days: 7
